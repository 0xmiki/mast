<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to Mast</title>
{{ICON}}
<style>{{STYLE}}
/* The welcome page (design C25; Canvas "Onboarding"), opened once on a new
   install: welcome, bring everything over from another browser in one click,
   pick a search engine (Google to begin with), done. Titles only: no lines
   of explanation under them. */
body { display: flex; justify-content: center; min-height: 100vh; margin: 0; padding: 18vh 24px 40px; box-sizing: border-box; text-align: center; }
/* On the picture (design C26): Customize's, which a new profile starts with
   (Among the Sierra Nevada). No wash over it: the page runs on from the tab
   row, which shows the picture as it is. No logo, no tagline. */
#wall { position: fixed; inset: 0; z-index: -1; background: var(--bg) center / cover no-repeat; }
body.wall { background: transparent; color: #f2f2f2; --text: #f2f2f2; --text-2: rgb(242 242 242/.72); --text-3: rgb(242 242 242/.5); }
.credit { position: fixed; left: 24px; bottom: 20px; margin: 0; color: rgb(255 255 255/.4); font-size: 11px; }
main { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 760px; }
.step { display: none; flex-direction: column; align-items: center; width: 100%; animation: in .25s ease; }
.step.on { display: flex; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .step { animation: none; } }
h1 { margin: 0; color: var(--text); font-size: 40px; font-weight: 500; letter-spacing: -.025em; line-height: 1.1; }
h2 { margin: 0; color: var(--text); font-size: 34px; font-weight: 500; letter-spacing: -.024em; }
button { font: inherit; cursor: pointer; }
.primary, .secondary { height: 40px; padding: 0 22px; border-radius: 20px; font-size: 14px; font-weight: 600; }
/* White, not ember: in Mast, ember always means blocked. */
.primary { border: 0; background: var(--text); color: var(--bg); }
.primary:hover { filter: brightness(.92); }
.secondary { border: 0; background: rgb(255 255 255/.12); color: var(--text); }
.secondary:hover { background: rgb(255 255 255/.18); }
.primary:disabled, .secondary:disabled { cursor: default; opacity: .5; filter: none; }
.quiet { margin-top: 32px; border: 0; background: none; color: var(--text-2); font-size: 14px; font-weight: 600; }
.quiet:hover { color: var(--text); }
.go { margin-top: 32px; }
.dots { display: flex; gap: 6px; margin-top: 28px; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: rgb(255 255 255/.18); transition: width .2s; }
.dots i.on { width: 18px; background: var(--text); }
/* Step 2: the browsers found. */
.list { width: 560px; max-width: 100%; margin-top: 32px; padding: 6px; border: 1px solid rgb(255 255 255/.08); border-radius: 14px; background: rgb(10 10 10/.65); text-align: left; box-sizing: border-box; }
.row { display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 14px; border-radius: 10px; }
.row:first-child { background: rgb(255 255 255/.06); }
.ic { display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 50%; color: #fff; font-size: 15px; font-weight: 700; }
.row .tx { flex: 1; min-width: 0; }
.row .nm, .row .meta { display: block; }
.row .nm { color: var(--text); font-size: 14px; font-weight: 600; }
.row .nm small { margin-left: 8px; color: var(--text-3); font-size: 12px; font-weight: 400; }
.row .meta { margin-top: 4px; color: var(--text-3); font-size: 12px; }
/* Not ember: in Mast, ember means blocked. Brighter text is enough. */
.row .meta.warn { color: var(--text-2); }
.row button { height: 32px; padding: 0 16px; font-size: 13px; }
.empty { padding: 24px; color: var(--text-2); text-align: center; }
.what { width: 560px; max-width: 100%; margin-top: 16px; text-align: left; }
.what h4 { margin: 0 0 10px; color: var(--text-2); font-size: 12px; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 8px; border: 0; border-radius: 14px; background: rgb(10 10 10/.55); color: var(--text-2); font-size: 12px; }
.chip i { display: grid; place-items: center; width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1.5px var(--text-3); }
.chip.on { color: var(--text); }
.chip.on i { background: var(--text); box-shadow: none; color: var(--bg); }
.list .none { padding: 18px 14px; color: var(--text-2); font-size: 14px; }
/* Step 3: the search engine, a list like step 2's, names only; the picked
   one is lit. */
.engines { margin-top: 32px; }
.engine { display: flex; align-items: center; gap: 14px; width: 100%; height: 52px; padding: 0 16px 0 18px; border: 0; border-radius: 10px; background: none; text-align: left; }
.engine:hover { background: rgb(255 255 255/.04); }
.engine.on { background: rgb(255 255 255/.08); }
.engine .nm { flex: 1; color: var(--text); font-size: 14px; font-weight: 600; }
.engine .radio { width: 18px; height: 18px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgb(242 242 242/.35); }
.engine.on .radio { background: var(--bg); box-shadow: inset 0 0 0 5.5px var(--text); }
/* Step 4. */
.done { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 22px; border-radius: 50%; background: rgb(255 255 255/.12); color: var(--text); }
.sum { display: flex; flex-direction: column; gap: 12px; width: 460px; max-width: 100%; margin-top: 32px; text-align: left; }
.sum div { display: flex; gap: 12px; }
.sum i { display: grid; place-items: center; flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; background: rgb(255 255 255/.14); color: var(--text); }
.sum b { display: block; color: var(--text); font-size: 14px; font-weight: 600; }
.sum span { display: block; margin-top: 2px; color: var(--text-3); font-size: 13px; }
.actions { display: flex; gap: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div id="wall" aria-hidden="true"></div>
<main>
  <section class="step on" id="s0">
    <h1>Welcome to Mast</h1>
    <button class="primary go" data-go="1">Get started</button>
  </section>

  <section class="step" id="s1">
    <h2>Bring your stuff over</h2>
    <div class="list" id="list" style="visibility: hidden"></div>
    <div class="what" id="what">
      <h4>What comes over</h4>
      <div class="chips" id="chips"></div>
    </div>
    <button class="quiet" data-go="2" id="skip">Skip for now</button>
  </section>

  <section class="step" id="s2">
    <h2>Your search engine</h2>
    <div class="list engines" id="engines" role="radiogroup" aria-label="Search engine"></div>
    <button class="primary go" data-go="3">Continue</button>
  </section>

  <section class="step" id="s3">
    <div class="done"><svg width="26" height="26" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3.5 8.5l3 3 6-7"/></svg></div>
    <h2>You're all set</h2>
    <div class="sum" id="sum"></div>
    <div class="actions">
      <button class="secondary" id="default">Make Mast your default browser</button>
      <button class="primary" id="start">Start browsing</button>
    </div>
  </section>

  <div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div>
</main>
<p class="credit">{{CREDIT}}</p>
<script>
const $ = (id) => document.getElementById(id);
// The picture (Customize's), faded in once it has loaded.
const wallpaper = {{WALLPAPER}};
if (wallpaper > 0) {
  document.body.classList.add('wall');
  const img = new Image();
  img.onload = () => { $('wall').style.backgroundImage = `url(wallpaper-${wallpaper}.jpg)`; };
  img.src = `wallpaper-${wallpaper}.jpg`;
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const tick = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 5.2l2 2 4-4.4"/></svg>';
const COLORS = {chrome: '#2f6fe4', brave: '#e2541f', edge: '#0f8fd8', vivaldi: '#d6333a', opera: '#c8102e', arc: '#5b4bdb', chromium: '#4a7fd6', firefox: '#ff8a1f'};
const what = {bookmarks: true, history: true, extensions: true};
let sources = null, busy = '', step = 0, imported = null;
// Sources that couldn't be read because the browser is running (Firefox locks
// its profile): their row says so until the next try.
const closeFirst = new Set();
// The search engines on offer, by Chromium's prepopulated id
// (kWelcomeEngines in mast_ui.cc), and the one in use: Google on a new profile.
const ENGINES = [[1, 'Google'], [92, 'DuckDuckGo'], [3, 'Bing'], [109, 'Brave Search'], [21, 'Baidu'], [15, 'Yandex']];
let engine = 1;

function go(n) {
  step = n;
  document.querySelectorAll('.step').forEach((s, i) => s.classList.toggle('on', i === n));
  document.querySelectorAll('#dots i').forEach((d, i) => d.classList.toggle('on', i === n));
  if (n === 1 && !sources) chrome.send('welcomeSources');
  if (n === 2) { renderEngines(); chrome.send('welcomeEngine'); }
  if (n === 3) renderDone();
}
function renderEngines() {
  $('engines').innerHTML = ENGINES.map(([id, name]) =>
    `<button class="engine ${id === engine ? 'on' : ''}" role="radio" aria-checked="${id === engine}" data-engine="${id}">
      <span class="nm">${esc(name)}</span><i class="radio"></i></button>`).join('');
}
const count = (n, one, many) => `${n.toLocaleString()} ${n === 1 ? one : many}`;
function meta(s) {
  const parts = [];
  if (s.bookmarks > 0) parts.push(count(s.bookmarks, 'bookmark', 'bookmarks'));
  if (s.bookmarks < 0) parts.push('Bookmarks');
  if (s.extensions > 0) parts.push(count(s.extensions, 'extension', 'extensions'));
  if (s.history) parts.push('history');
  return parts.join(' · ');
}
function renderList() {
  if (!sources) return;
  $('what').style.display = sources.length ? '' : 'none';
  $('skip').textContent = sources.length ? 'Skip for now' : 'Continue';
  $('list').style.visibility = '';
  $('list').innerHTML = !sources.length ? '<div class="none">No other browsers on this computer</div>' : sources.map((s, i) => {
    const key = s.id.split('/')[0].replace(/-.*/, '');
    return `<div class="row"><span class="ic" style="background:${COLORS[key] || '#555'}">${esc(s.browser[0] || '?')}</span>
      <span class="tx"><span class="nm">${esc(s.browser)}${s.profile ? `<small>${esc(s.profile)}</small>` : ''}</span>${closeFirst.has(s.id) ? `<span class="meta warn">Close ${esc(s.browser)}, then import again</span>` : `<span class="meta">${esc(meta(s))}</span>`}</span>
      <button class="${i === 0 ? 'primary' : 'secondary'}" data-import="${esc(s.id)}" ${busy ? 'disabled' : ''}>${busy === s.id ? 'Importing…' : 'Import'}</button></div>`;
  }).join('');
  $('chips').innerHTML = [['bookmarks', 'Bookmarks'], ['history', 'History'], ['extensions', 'Extensions']].map(([k, label]) =>
    `<button class="chip ${what[k] ? 'on' : ''}" data-what="${k}" aria-pressed="${what[k]}"><i>${what[k] ? tick : ''}</i>${label}</button>`).join('');
}
// What came over, one line each, and the search engine.
function renderDone() {
  const r = imported, items = [];
  if (r) {
    if (r.bookmarks > 0) items.push(count(r.bookmarks, 'bookmark', 'bookmarks'));
    if (r.bookmarks < 0) items.push('Bookmarks');
    if (r.extensions > 0) items.push(count(r.extensions, 'extension', 'extensions'));
    if (r.history > 0) items.push(count(r.history, 'page of history', 'pages of history'));
    if (r.history < 0) items.push('History');
    if (!r.ok) items.push(`Some of ${r.browser} couldn't come over`);
  }
  const e = ENGINES.find(([id]) => id === engine);
  if (e) items.push(`Search: ${e[1]}`);
  $('sum').style.display = items.length ? '' : 'none';
  $('sum').innerHTML = items.map((b) => `<div><i>${tick}</i><span><b>${esc(b)}</b></span></div>`).join('');
}

window.mastWelcome = (m) => {
  if (m.sources) { sources = m.sources; renderList(); }
  if (m.result && m.result.closeFirst) { closeFirst.add(busy); busy = ''; renderList(); }
  else if (m.result) { busy = ''; imported = m.result; go(2); }
  if ('engine' in m) { engine = m.engine; if (step === 2) renderEngines(); }
  if ('isDefault' in m) {
    const b = $('default');
    b.disabled = m.isDefault;
    b.textContent = m.isDefault ? 'Mast is your default browser' : 'Make Mast your default browser';
  }
};

document.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.go) return go(+t.dataset.go);
  if (t.dataset.engine) { engine = +t.dataset.engine; renderEngines(); return chrome.send('welcomeSetEngine', [engine]); }
  if (t.dataset.what) { what[t.dataset.what] = !what[t.dataset.what]; return renderList(); }
  if (t.dataset.import && !busy) { busy = t.dataset.import; closeFirst.delete(busy); renderList(); return chrome.send('welcomeImport', [busy, what]); }
  if (t.id === 'default') return chrome.send('welcomeDefault');
  if (t.id === 'start') location.href = 'chrome://newtab/';
});
</script>
</body>
</html>
