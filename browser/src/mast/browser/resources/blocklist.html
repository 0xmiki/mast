<!-- The blocklist (design C33, C34): YouTube's four choices, the categories in
     one box (Mast's and the user's own), how long, Block; and the Shortcuts
     tab. A fragment, not a page: chrome://mast shows it full page and the new
     tab page in a panel (embedded as the BLOCKLIST placeholder by
     mast_pages.cc). Styles are scoped under .bl, clicks stay inside its root,
     so it doesn't clash with the page around it.
     What's picked here is the distraction set (MastBlocks::Distractions): every
     category to begin with, saved as it changes, and the same thing the new
     tab's Block button blocks.
     API: MastBlocklist.mount(element), MastBlocklist.update(state) -> true if it
     handled the result of its own request (so the host page shouldn't also
     react), MastBlocklist.reset() (back to the categories). MastSet reads the
     set and the running blocks, for the new tab's dock too. -->
<style>
.bl header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
/* The panel's two tabs are its titles (design C32, kept in C35): the other one
   dimmed. A click leaves no focus box; the keyboard still gets one. */
.bl .tabs { display: flex; align-items: baseline; gap: 22px; margin: 0; }
.bl .tabs button { padding: 0; border: 0; border-radius: 4px; background: none; color: var(--text-3); font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.bl .tabs button:hover { color: var(--text-2); }
.bl .tabs button.on { color: var(--text); }
.bl .tabs button:focus:not(:focus-visible) { outline: none; }
.bl .meta { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.bl .meta b { color: var(--text-2); font-weight: 500; }
.bl .search { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 14px; border-radius: 8px; background: var(--field); color: var(--text-3); cursor: text; }
.bl .search:focus-within, .bl .addsite:focus-within { box-shadow: 0 0 0 1px var(--text-3); }
.bl .search input, .bl .addsite input, .bl .newcat input { flex: 1; min-width: 0; width: auto; height: 100%; margin: 0; padding: 0; border: 0; border-radius: 0;
  outline: 0; background: none; box-shadow: none; color: var(--text); font-size: 13px; }
.bl input::placeholder { color: var(--text-3); }
/* YouTube: its four choices, always on show, and under them, in grey, the
   block in force (design C32). */
.bl .yt { margin-top: 16px; padding: 14px; border-radius: 10px; background: var(--field); }
.bl .yt .top { margin: 0 2px 12px; font-size: 14px; font-weight: 600; }
.bl .ytc { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bl .ytc button { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 12px; border: 0; border-radius: 8px; background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line); color: var(--text); font-size: 13px; font-weight: 600; text-align: left; white-space: nowrap; }
.bl .ytc button:hover { background: var(--pressed); }
.bl .ytc .dot { width: 16px; height: 16px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--text) 30%, transparent); }
.bl .ytc button.on { background: var(--pressed); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 35%, transparent); }
.bl .ytc button.on .dot { box-shadow: inset 0 0 0 5px var(--text); }
.bl .yt .st { display: flex; align-items: center; gap: 5px; margin: 12px 2px 0; color: var(--text-2); font-size: 12px; }
.bl .yt .st svg, .bl .lock svg { flex: none; color: var(--text-3); }
/* A box: the categories, a category's sites, search results (design C33). */
.bl .box { margin-top: 16px; padding: 6px 6px 8px; border-radius: 10px; background: var(--field); }
.bl .box-h { display: flex; align-items: center; gap: 8px; min-height: 28px; margin-bottom: 4px; padding: 6px 6px 8px 12px; border-bottom: 1px solid var(--line); }
.bl .box-h b { font-size: 14px; font-weight: 600; white-space: nowrap; }
.bl .box-h .n { flex: 1; min-width: 0; overflow: hidden; color: var(--text-3); font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
.bl .box + .box { margin-top: 12px; }
.bl .pill { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-radius: 14px; background: var(--pressed);
  color: var(--text); font-size: 12px; font-weight: 600; }
.bl .pill .cb { width: 16px; height: 16px; border-radius: 4px; }
.bl .rows { display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; }
/* A category: its checkbox picks all of it, its › opens its sites. */
.bl .cat { position: relative; min-width: 0; }
.bl .cat .tg { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 38px 0 12px; border: 0; border-radius: 6px;
  background: none; text-align: left; }
.bl .cat .tg:hover { background: var(--pressed); }
/* The name keeps its room; the grey text after it gives way. */
.bl .cat .nm { flex: 0 1 auto; min-width: 0; overflow: hidden; font-size: 13px; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; }
.bl .cat .sm { display: flex; flex: 1 1 0; justify-content: flex-end; align-items: center; gap: 5px; min-width: 0; color: var(--text-3); font-size: 12px; }

.bl .sm span, .bl .lock span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bl .cat .more, .bl .site .rm { position: absolute; top: 7px; right: 6px; display: grid; place-items: center; width: 26px; height: 26px; padding: 0; border: 0;
  border-radius: 13px; background: none; color: var(--text-3); }
.bl .cat .more:hover, .bl .site .rm:hover { background: var(--pressed); color: var(--text); }
.bl .newcat { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 12px; border: 1px dashed color-mix(in srgb, var(--text) 16%, transparent);
  border-radius: 6px; background: none; color: var(--text-2); font-size: 13px; font-weight: 500; text-align: left; }
.bl button.newcat:hover { color: var(--text); }
.bl .newcat.on { border-style: solid; border-color: var(--text-3); cursor: text; }
/* Picked is a checkbox and nothing else (design C31): white with a tick, a dash
   when only some sites are, an empty outline when none. */
.bl .cb { display: grid; place-items: center; width: 16px; height: 16px; flex: none; border-radius: 4px;
  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--text) 30%, transparent); color: var(--bg); }
.bl .cb.on, .bl .cb.part { background: var(--text); box-shadow: none; }
/* A category's page (C33b, C33c). */
.bl .sv { display: flex; align-items: center; gap: 10px; margin: 20px 0 14px; }
.bl .sv .back { display: grid; flex: none; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 15px; background: var(--field); color: var(--text-2); }
.bl .sv .back:hover { color: var(--text); }
.bl .sv h2 { margin: 0; overflow: hidden; font-size: 16px; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
.bl .sv .ren { display: grid; flex: none; place-items: center; width: 26px; height: 26px; padding: 0; border: 0; border-radius: 13px; background: none; color: var(--text-3); }
.bl .sv .ren:hover { background: var(--field); color: var(--text); }
.bl .sv .ren-in { width: 240px; height: 30px; margin: 0; padding: 0 10px; border: 0; border-radius: 6px; outline: 0; background: var(--field);
  box-shadow: inset 0 0 0 1px var(--text-3); color: var(--text); font-size: 15px; font-weight: 600; }
.bl .sv .n { flex: 1; min-width: 0; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.bl .sv .act { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: var(--field);
  color: var(--text-2); font-size: 12px; font-weight: 500; }
.bl .sv .act:hover:not(:disabled) { color: var(--text); }
.bl .sv .act:disabled { opacity: .5; cursor: default; }
.bl .sv .act.sure { color: var(--signal); }
.bl .sv + .yt { margin: 0 0 12px; }
.bl .addsite { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 4px 0 14px; border-radius: 8px; background: var(--field); color: var(--text-3); cursor: text; }
.bl .addsite button { height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--pressed); color: var(--text); font-size: 12px; font-weight: 600; }
.bl .addsite button:disabled { color: var(--text-3); cursor: default; }
.bl .note { margin: 8px 2px 0; color: var(--text-2); font-size: 12px; }
.bl .note.bad { color: var(--signal); }
.bl .empty { padding: 12px; color: var(--text-3); font-size: 12px; }
/* One site, to pick or leave out; the user's own can be removed. */
.bl .site { position: relative; min-width: 0; }
.bl .site .tg { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px 0 12px; border: 0; border-radius: 6px; background: none; text-align: left; }
.bl .site .tg:hover { background: var(--pressed); }
.bl .site.rmv .tg { padding-right: 38px; }
.bl .site img { width: 18px; height: 18px; flex: none; border-radius: 4px; }
.bl .site .s { overflow: hidden; font-size: 13px; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; }
.bl .site .tg[aria-pressed=false] .s { color: var(--text-2); }
.bl .site .d { flex: 1; min-width: 0; overflow: hidden; color: var(--text-3); font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
.bl .site .lock { display: flex; flex: none; align-items: center; gap: 4px; color: var(--text-2); font-size: 12px; }
/* Shortcuts (design C34): the form stays on top, the list is a table under it. */
.bl .sc-form { padding: 12px 12px 12px 14px; border-radius: 10px; background: var(--field); }
.bl .sc-line { display: flex; align-items: center; gap: 8px; }
.bl .sc-line input { flex: 1; min-width: 0; height: 36px; margin: 0; padding: 0 12px; border: 0; border-radius: 7px; outline: 0; background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line); color: var(--text); font-size: 13px; }
.bl .sc-line input.url { flex: 1.5; }
.bl .sc-line input:focus { box-shadow: inset 0 0 0 1px var(--text-3); }
.bl .sc-key { display: flex; flex: none; align-items: center; gap: 4px; width: 104px; height: 36px; overflow: hidden; padding: 0 8px 0 10px; border: 0; border-radius: 7px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--text-3); font-size: 13px; text-align: left; white-space: nowrap; }
.bl .sc-key.listening { box-shadow: inset 0 0 0 1px var(--text-2); color: var(--text-2); }
.bl .sc-key.bad { box-shadow: inset 0 0 0 1px var(--signal); }
.bl .sc-cancel { flex: none; height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: none; box-shadow: inset 0 0 0 1px var(--line); color: var(--text-2); font-weight: 500; }
.bl .sc-cancel:hover { color: var(--text); }
.bl .sc-line .primary { flex: none; }
.bl .sc-msg { margin: 10px 2px 0; color: var(--text-3); font-size: 12px; line-height: 1.5; }
.bl .sc-msg.ok { color: var(--text-2); }
.bl .sc-msg.bad { color: var(--signal); }
.bl .keys { display: inline-flex; align-items: center; gap: 3px; }
.bl kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 4px; background: var(--pressed);
  box-shadow: inset 0 -1px 0 var(--line), inset 0 0 0 1px var(--line); color: var(--text); font: 600 11px var(--font, inherit); }
.bl .sc-table { margin-top: 16px; overflow: hidden; border-radius: 10px; background: var(--field); }
.bl .sc-tr { display: grid; grid-template-columns: 88px minmax(0, 1fr) minmax(0, 1.5fr) 56px; align-items: center; gap: 12px; height: 40px; padding: 0 8px 0 14px;
  border-top: 1px solid var(--line); }
.bl .sc-tr.th { height: 32px; border-top: 0; background: rgb(255 255 255/.02); color: var(--text-3); font-size: 11px; font-weight: 500; }
.bl .sc-tr.editing { background: var(--pressed); }
.bl .sc-tr .nm { overflow: hidden; font-size: 13px; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; }
.bl .sc-tr .u { overflow: hidden; color: var(--text-3); font-size: 12px; white-space: nowrap; text-overflow: ellipsis; }
.bl .sc-tr .acts { display: flex; justify-content: flex-end; gap: 2px; }
.bl .sc-tr .acts button { display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 12px; background: none; color: var(--text-3); }
.bl .sc-tr .acts button:hover { background: var(--pressed); color: var(--text); }
.bl .sc-none { padding: 14px; color: var(--text-3); font-size: 12px; }
.bl.on-sc .search, .bl.on-sc .action { display: none; }
.bl.on-sc .bl-body { padding-bottom: 28px; }
.bl .action { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 10px; margin-top: 22px; padding: 16px 0 24px;
  border-top: 1px solid var(--line); background: var(--bl-bg, var(--surface)); }
.bl .action .row { display: flex; align-items: center; gap: 12px; }
.bl .action .primary { flex: none; }
.bl .seg { display: grid; flex: 1; grid-template-columns: repeat(6, 1fr); padding: 2px; border-radius: var(--r); background: var(--seg); }
.bl .seg button { height: 30px; padding: 0 6px; border: 0; border-radius: 4px; background: none; color: var(--text-2); font-weight: 500; white-space: nowrap; }
.bl .seg button:hover { color: var(--text); }
.bl .seg button.on { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0/.25), 0 0 0 1px var(--line); }
/* Adult and gambling sites aren't in the list, and it doesn't mention them: they're always
   blocked (mast_feeds.h); opening one shows a plain "Blocked" page. */
@media (max-width: 640px) {
  .bl .rows { grid-template-columns: 1fr; }
  .bl .ytc { grid-template-columns: 1fr 1fr; }
  .bl .sc-line { flex-wrap: wrap; }
  .bl .sc-tr { grid-template-columns: 80px minmax(0, 1fr) 56px; }
  .bl .sc-tr .u { display: none; }
  .bl .action .row { flex-direction: column; align-items: stretch; }
  .bl .seg { grid-template-columns: repeat(3, 1fr); }
}
.bl-toast { position: fixed; left: 50%; bottom: 24px; z-index: 30; transform: translateX(-50%); display: flex; align-items: center;
  gap: 14px; padding: 10px 10px 10px 16px; border-radius: 10px; background: var(--field); box-shadow: var(--shadow); white-space: nowrap; }
.bl-toast.plain { padding-right: 16px; }
.bl-toast button { height: 28px; padding: 0 12px; border: 0; border-radius: 4px; background: var(--pressed); font-weight: 500; }
.bl-toast .secs { margin-left: 4px; color: var(--text-3); }
/* "Block forever?" (design C27b): forever is the one choice that can't be
   taken back, so it asks, and the button has to be held for 2 seconds. */
dialog.forever { width: 420px; padding: 24px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text-2); text-align: left; box-shadow: 0 16px 40px rgb(0 0 0/.7); }
dialog.forever::backdrop { background: rgb(0 0 0/.5); }
dialog.forever h3 { margin: 0 0 10px; color: var(--text); font-size: 17px; font-weight: 600; }
dialog.forever p { margin: 0; font-size: 13px; line-height: 1.55; }
dialog.forever ul { display: grid; gap: 8px; margin: 14px 0 0; padding: 0; list-style: none; font-size: 13px; }
dialog.forever li { display: flex; align-items: center; gap: 10px; }
dialog.forever li::before { content: "×"; width: 14px; color: var(--text-3); text-align: center; }
dialog.forever .acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
dialog.forever .acts button { height: 36px; padding: 0 16px; border: 0; border-radius: 999px; font-size: 13px; font-weight: 600; }
dialog.forever .no { background: rgb(255 255 255/.08); color: var(--text); }
dialog.forever .hold { position: relative; overflow: hidden; min-width: 200px; background: var(--text); color: var(--bg); user-select: none; touch-action: none; }
dialog.forever .hold::before { content: ""; position: absolute; inset: 0; background: var(--signal); transform: scaleX(0); transform-origin: left; transition: transform .2s; }
dialog.forever .hold.holding::before { transform: scaleX(1); transition: transform 2s linear; }
dialog.forever .hold span { position: relative; }
dialog.forever .foot { margin-top: 12px; color: var(--text-3); font-size: 11px; }
</style>
<script>
// Asks before a forever block. `what` names it ("YouTube", "These 3 categories",
// "Everything you picked"); `confirm` runs once the button has been held.
function mastConfirmForever(what, confirm) {
  const d = document.createElement('dialog');
  d.className = 'forever';
  d.innerHTML = `<h3>Block forever?</h3>
    <p>${String(what).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]))} will never open in Mast again. Think it over: this is the one choice Mast won't let you take back.</p>
    <ul><li>No end date</li><li>No way to lift it, from here or from Settings</li><li>No undo after 10 seconds</li></ul>
    <div class="acts"><button class="no">Cancel</button><button class="hold"><span>Hold to block forever</span></button></div>
    <div class="foot">Keep holding for 2 seconds.</div>`;
  document.body.append(d);
  const hold = d.querySelector('.hold');
  let timer = 0;
  const start = () => {
    if (timer) return;
    hold.classList.add('holding');
    timer = setTimeout(() => { timer = 0; d.close(); confirm(); }, 2000);
  };
  const stop = () => { clearTimeout(timer); timer = 0; hold.classList.remove('holding'); };
  hold.addEventListener('pointerdown', (e) => { e.preventDefault(); hold.setPointerCapture(e.pointerId); start(); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) hold.addEventListener(ev, stop);
  hold.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); start(); } });
  hold.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') stop(); });
  hold.addEventListener('click', (e) => e.preventDefault());  // a click alone does nothing
  d.querySelector('.no').addEventListener('click', () => d.close());
  d.addEventListener('click', (e) => e.stopPropagation());  // not the page's own handlers
  d.addEventListener('close', () => { stop(); d.remove(); });
  d.showModal();
  d.querySelector('.no').focus();
}

// Line icons (Lucide, ISC licence): mastIcon('lock', 12).
const mastIcon = (() => {
  const P = {
    lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    minus: '<path d="M5 12h14"/>',
    pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
    trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    'chevron-right': '<path d="m9 18 6-6-6-6"/>',
    'chevron-left': '<path d="m15 18-6-6 6-6"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    settings: '<path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/>',
  };
  return (name, size = 16) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[name] || ''}</svg>`;
})();

// The distraction set and the blocks in force, read from the state (no DOM):
// the blocklist panel and the new tab's dock both count from here.
const MastSet = (() => {
  const YT = 'youtube.com', MUSIC = 'music:youtube.com', SHORTS = 'shorts:youtube.com';
  const isYouTube = (s) => !s.added && s.domains.includes(YT);
  const key = (c, s) => c.id + '/' + s.name;
  // The block that ends first; forever ends last.
  const soonest = (a, b) => (a.until === null ? b : b.until === null ? a : b.until < a.until ? b : a);
  const later = (a, b) => (a.until === b.until ? 0 : a.until === null ? 1 : b.until === null ? -1 : a.until - b.until);
  // Mast's categories, with the sites the user added to them, then the user's
  // own categories (design C33). A site the user added is {added: true}.
  function categories(state) {
    const adds = state.additions || {};
    const site = (d) => ({name: d, domains: [d], added: true});
    return [
      ...state.categories.map((c) => (adds[c.id] ? {...c, services: [...c.services, ...adds[c.id].map(site)]} : c)),
      ...(state.userCategories || []).map((c) => ({id: c.id, name: c.name, own: true, services: c.sites.map(site)})),
    ];
  }
  // YouTube's mode while it's in the set: 'site', 'music' or 'shorts'.
  function read(state) {
    const d = state.distractions || {};
    return {cats: new Set(d.categories || []), skipped: new Set(d.skipped || []), youtube: d.youtube || 'site'};
  }
  // A site is in when its category is and it isn't left out
  // (MastBlocks::Distractions).
  const has = (sel, c, s) => sel.cats.has(c.id) && !sel.skipped.has(key(c, s));
  const entries = (sel, s) => (!isYouTube(s) || sel.youtube === 'site' ? s.domains : [sel.youtube === 'music' ? MUSIC : SHORTS]);
  // Music only and Shorts add nothing while all of YouTube is blocked.

    if (!text || !view) return;
    if (!cleanDomain(text)) { note = {text: 'That doesn’t look like a web address.', bad: true}; return render(); }
    chrome.send('addSite', [view, text]);
  }
  function createCategory() {
    const name = kept.newcat.trim();
    if (!name) { naming = false; return render(); }
    chrome.send('createCategory', [name]);
  }
  function renameCategory() {
    const name = kept.rename.trim();
    const c = category(view);
    renaming = false;
    if (c && name && name !== c.name) chrome.send('renameCategory', [c.id, name]);
    render();
  }

  function onClick(e) {
    // The host page has its own buttons and handlers; this list's clicks are its own.
    e.stopPropagation();
    const t = e.target.closest('button');
    if (!t || !state) return;
    const cats = S.categories(state);
    const act = t.dataset.act;
    if (t.dataset.tab) {
      tab = t.dataset.tab;
      sc.listening = false;
      toTop();
    } else if (act === 'sckey') {
      Object.assign(sc, {listening: true, key: '', err: false, bad: false, ok: false, msg: ''});
    } else if (act === 'scadd') {
      if (!sc.key || sc.bad || !sc.url.trim()) return;
      return chrome.send('addShortcut', [sc.key, sc.name, sc.url, sc.editing]);
    } else if (act === 'sccancel') {
      Object.assign(sc, SC_EMPTY);
    } else if (t.dataset.scedit) {
      const s = (state.shortcuts || []).find((x) => x.key === t.dataset.scedit);
      if (!s) return;
      Object.assign(sc, SC_EMPTY, {editing: s.key, key: s.key, name: s.name, url: shortUrl(s.url)});
      toTop();
    } else if (t.dataset.scrm) {
      if (sc.editing === t.dataset.scrm) Object.assign(sc, SC_EMPTY);
      return chrome.send('removeShortcut', [t.dataset.scrm]);
    } else if (act === 'all' || act === 'none') {
      setAll(act === 'all');
    } else if (act === 'newcat') {
      naming = true;
      kept.newcat = '';
      render();
      return focusField('newcat');
    } else if (act === 'rename') {
      renaming = true;
      kept.rename = (category(view) || {}).name || '';
      render();
      return focusField('rename');
    } else if (act === 'delcat') {
      if (!sureDelete) { sureDelete = true; return render(); }
      sureDelete = false;
      return chrome.send('deleteCategory', [view]);
    } else if (act === 'addsite') {
      return addSite();
    } else if (t.dataset.cat) {
      const c = cats.find((x) => x.id === t.dataset.cat);
      if (!c) return;
      const sel = S.read(state);
      setCategory(c, !c.services.every((s) => S.has(sel, c, s)));
    } else if (t.dataset.svc) {
      const i = t.dataset.svc.indexOf('/');
      const c = cats.find((x) => x.id === t.dataset.svc.slice(0, i));
      const s = c && c.services.find((x) => x.name === t.dataset.svc.slice(i + 1));
      if (!s) return;
      setSite(c, s, !S.has(S.read(state), c, s));
    } else if (t.dataset.yt) {
      const [c, s] = youtube();
      if (!c) return;
      const mode = t.dataset.yt;
      setSite(c, s, mode !== 'open', mode === 'open' ? undefined : mode);
    } else if ('view' in t.dataset) {
      open(t.dataset.view);
    } else if (t.dataset.dur) {
      dur = t.dataset.dur;
    } else if (t.dataset.rm) {
      const i = t.dataset.rm.indexOf('/');
      return chrome.send('removeSite', [t.dataset.rm.slice(0, i), t.dataset.rm.slice(i + 1)]);
    } else if (act === 'block') {
      const sum = S.summary(state);
      if (!sum.open) return;
      const go = () => { pending = sum.what; asked = true; chrome.send('blockDistractions', [dur]); };
      // Forever asks first (design C27b); timed blocks have their undo.
      return dur === 'forever' ? mastConfirmForever(sum.asked, go) : go();
    } else if (act === 'undo') {
      clearInterval(toastTimer);
      toastHost.innerHTML = '';
      asked = true;
      return chrome.send('undo');
    } else return;
    render();
  }
  function onInput(e) {
    const t = e.target;
    if (t.dataset.k) {
      kept[t.dataset.k] = t.value;
      if (t.dataset.k === 'add' && note) { note = null; render(); }
      return;
    }
    if (t.matches('[data-scname]')) { sc.name = t.value; return; }
    if (t.matches('[data-scurl]')) {
      sc.err = false;
      const ready = !!sc.url.trim() === !!t.value.trim();
      sc.url = t.value;
      if (!ready) render();  // Add turns on or off
      return;
    }
    if (!t.matches('[data-q]')) return;
    query = t.value;
    render();
  }
  function onKey(e) {
    e.stopPropagation();
    const t = e.target;
    // Recording a shortcut: Alt + a letter (Escape stops).
    if (tab === 'sc' && sc.listening) {
      if (e.key === 'Escape') { e.preventDefault(); Object.assign(sc, {listening: false, msg: '', bad: false}); return render(); }
      if (['Alt', 'Shift', 'Control', 'Meta', 'AltGraph'].includes(e.key)) return;
      e.preventDefault();
      if (!e.altKey || e.ctrlKey || e.metaKey) {
        Object.assign(sc, {bad: true, ok: false, msg: 'Hold Alt and press a letter.'});
        return render();
      }
      const k = e.code.startsWith('Key') ? e.code.slice(3) : e.code.startsWith('Digit') ? e.code.slice(5) : '';
      if (!k) return;
      pickKey(k);
      return render();
    }
    if (tab === 'sc' && e.key === 'Enter' && (t.matches('[data-scname]') || t.matches('[data-scurl]'))) {
      e.preventDefault();
      if (sc.key && !sc.bad && sc.url.trim()) chrome.send('addShortcut', [sc.key, sc.name, sc.url, sc.editing]);
      return;
    }
    const k = t.dataset.k;
    if (k && (e.key === 'Enter' || e.key === 'Escape')) {
      e.preventDefault();  // Escape leaves the field, not the panel
      const enter = e.key === 'Enter';
      if (k === 'add') { if (enter) addSite(); else { kept.add = ''; note = null; render(); } }
      else if (k === 'newcat') { if (enter) createCategory(); else { naming = false; render(); } }
      else if (k === 'rename') { if (enter) renameCategory(); else { renaming = false; render(); } }
      return;
    }
    if (t.matches('[data-q]') && e.key === 'Escape' && t.value) {
      e.preventDefault();  // clears the search; a second Escape closes the panel
      t.value = query = '';
      render();
    }
  }
  // Leaving a name field: an empty new category is dropped, a rename is saved.
  function onBlur(e) {
    const k = e.target.dataset && e.target.dataset.k;
    if (k === 'newcat' && naming && !kept.newcat.trim()) { naming = false; setTimeout(render); }
    if (k === 'rename' && renaming) setTimeout(renameCategory);
  }

  return {
    mount(el) {
      if (root) return;
      root = el;
      root.classList.add('bl');
      root.innerHTML = `<div class="bl-app">
          <header><nav class="tabs"><button data-tab="bl" class="on">Blocklist</button><button data-tab="sc">Shortcuts</button></nav>
            <span class="meta"></span></header>
          <label class="search">${mastIcon('search', 16)}<input data-q placeholder="Search all sites"
            spellcheck="false" autocomplete="off" aria-label="Search all sites"></label>
          <div class="bl-body"></div>
          <div class="action"></div>
        </div><div class="bl-toast-host"></div>`;
      metaEl = root.querySelector('.meta');
      bodyEl = root.querySelector('.bl-body');
      actionEl = root.querySelector('.action');
      searchEl = root.querySelector('[data-q]');
      toastHost = root.querySelector('.bl-toast-host');
      root.addEventListener('click', onClick);
      root.addEventListener('input', onInput);
      root.addEventListener('keydown', onKey);
      root.addEventListener('focusout', onBlur);
      render();
    },
    // Back to the categories, search cleared (the new tab opens the panel this way).
    reset() {
      tab = 'bl';
      view = '';
      query = '';
      naming = renaming = sureDelete = false;
      note = null;
      if (searchEl) searchEl.value = '';
      render();
    },
    update(s) {
      const first = !state;
      state = s;
      if (first) dur = s.lastDuration || 'today';
      let handled = false;
      const r = s.result || {};
      if (r.shortcut) {
        handled = true;
        if (r.shortcut === 'added') {
          const saved = sc.editing ? 'Saved' : 'Added';
          Object.assign(sc, SC_EMPTY, {ok: true, msg: `${saved}. Press Alt + ${r.key} anywhere in Mast.`});
        } else if (r.shortcut === 'badUrl') {
          Object.assign(sc, {err: true, ok: false, msg: 'That doesn’t look like a web address.'});
        } else {
          pickKey(sc.key);  // taken meanwhile, e.g. in another tab
        }
      }
      if (r.site) {
        handled = true;
        if (r.site === 'added') { kept.add = ''; note = {text: `Added ${r.domain}.`, bad: false}; }
        else if (r.site === 'listed') note = {text: `Already in ${r.where}.`, bad: true};
        else note = {text: 'That doesn’t look like a web address.', bad: true};
      }
      if ('created' in r) {
        handled = true;
        naming = false;
        kept.newcat = '';
        if (r.created) open(r.created);
      }
      if ('deleted' in r) {
        handled = true;
        if (r.deleted) open('');
      }
      if (asked && (r.undone || 'changed' in r)) {
        asked = false;
        handled = true;
        if (root) {
          if (r.undone) toast('Undone.');
          else if (!r.changed) toast('Already blocked at least that long.');
          else toast(`Blocked ${pending} ${lower(r.until)}.`, true);
        }
      }
      render();
      if ('created' in r && r.created && root) focusField('add');
      return handled;
    },
  };
})();

// Customize's palette, live: the page was served with the palette of the
// time; a later pick (here or in another tab) arrives with the state.
function mastPalette(theme) {
  if (!theme) return;
  let el = document.getElementById('mast-palette');
  if (!el) {
    el = document.createElement('style');
    el.id = 'mast-palette';
    document.head.append(el);
  }
  if (el.textContent !== theme.css) el.textContent = theme.css;
}
</script>
