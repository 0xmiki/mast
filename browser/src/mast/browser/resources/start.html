<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
{{ICON}}
<style>{{STYLE}}
/* chrome://mast: the full blocklist (the new tab page shows the same list in a panel). */
.ntp { max-width: 760px; margin: 0 auto; padding: 56px 32px 96px; }
</style>
</head>
<body>
<div class="ntp" id="app"></div>
{{BLOCKLIST}}
<script>
MastBlocklist.mount(document.getElementById('app'));
window.mastState = (s) => MastBlocklist.update(s);
chrome.send('getState');
setInterval(() => document.visibilityState === 'visible' && chrome.send('getState'), 30e3);
</script>
</body>
</html>
